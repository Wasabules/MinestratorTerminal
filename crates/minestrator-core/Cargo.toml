[package]
name = "minestrator-core"
description = "Logique métier MineStrator, indépendante de l'UI (réutilisable : desktop, daemon, CLI)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Réseau : rustls (pas d'OpenSSL système).
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls-no-provider"] }
# TLS de reqwest et de la console : fournisseur `ring` + racines Mozilla embarquées (voir `http.rs`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
base64 = "0.23"

# Async + console WebSocket (Wings). `process` : agent CLI local (Copilote sans clé API).
# `io-std` : transport stdio du serveur MCP (`mcp::serve_stdio`). `net` : canal IPC local avec le
# service d'arrière-plan (socket Unix / canal nommé Windows, voir `service.rs`).
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs", "io-util", "io-std", "process", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Client SFTP natif.
# Backend crypto `ring` (pas `aws-lc-rs`, qui exige CMake/NASM et complique la compilation croisée
# Android) ; `rsa` : clés d'hôte RSA des serveurs Wings anciens.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"

# Stockage local de l'historique de métriques (SQLite embarqué, sans dépendance système).
rusqlite = { version = "0.43", features = ["bundled"] }
directories = "6"

# Parsing du rapport de profiler Spark (protobuf `x-spark-sampler`) — structs à la main, sans protoc.
prost = "0.14"

thiserror = "2"
tracing = "0.1"
# Journaux fichier à rotation quotidienne (`logs.rs`), partagés par l'app desktop, mobile et le daemon.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.3"

# Archives SFTP : ouverture .zip/.tar/.tar.gz/.gz + zip de téléchargement. Deflate PUR RUST
# (zlib-rs / zopfli), sans dépendance système.
flate2 = "1.1.9"
tar = "0.4.46"
zip = { version = "9.7", default-features = false, features = ["deflate"] }

# Décodage NBT (`.dat` Minecraft : level.dat, playerdata, structures) → JSON lisible. Pur Rust.
fastnbt = "2"

# Mods Satisfactory (ficsit.app) : vérification d'intégrité sha256 des artefacts + résolution des
# contraintes de versions (SML/dépendances, syntaxe semver `^3.12.0`).
sha2 = "0.11"
sha1 = "0.11"
semver = "1"

# Génération des types TypeScript des frontends (`desktop/src/lib/bindings`, `mobile/src/lib/bindings`)
# depuis les structures sérialisées. Optionnelle : jamais compilée dans les binaires livrés, seulement
# par `cargo bindings` / `cargo bindings-check` (voir `.cargo/config.toml` et `src/bindings.rs`).
# `no-serde-warnings` : ts-rs signale les attributs serde qu'il ignore — à raison pour
# `#[serde(from = …)]` (désérialisation seule ; le type TS décrit la forme SÉRIALISÉE).
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[features]
# Dérive `ts_rs::TS` sur les types qui traversent l'IPC et active le module `bindings`.
ts = ["dep:ts-rs"]

# Trousseau natif de l'OS (fonctionne aussi headless).
[target.'cfg(windows)'.dependencies]
keyring = "4"
# Service d'arrière-plan : état du service (SCM), SID de l'utilisateur, élévation UAC.
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Service d'arrière-plan : uid de l'utilisateur (propriétaire autorisé sur le socket).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = "4"
