[package]
name = "minestrator-terminal-mobile"
description = "App mobile (Android/iOS) pour piloter ses serveurs Minecraft via l'API MineStrator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# `_lib` évite un conflit de nom lib/bin ; `cdylib` est requis pour Android/iOS
# (la lib native chargée par l'activité Android / l'app iOS).
name = "minestrator_terminal_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pas de feature `tray-icon` (desktop-only) ici.
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
# Ouverture d'URL externe (lien vers le site MineStrator).
tauri-plugin-opener = "2"
# Transferts SFTP : `dialog` ouvre le sélecteur de fichiers Android (SAF) et `fs` sait lire /
# écrire les `content://` qu'il renvoie — un chemin de fichier classique n'existe pas côté Android.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Transport des octets de transfert via l'IPC (le JS ne sait pas passer de binaire brut).
base64 = "0.22"

# Toute la logique métier vit dans le core, partagé avec le desktop et le futur daemon.
minestrator-core = { path = "../../crates/minestrator-core" }

# Relais des CoreEvent (broadcast) vers le webview.
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auto-update mobile : check via l'API GitHub Releases + téléchargement de l'APK (rustls).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

tracing = "0.1"

# Génération des types TypeScript propres à l'adaptation mobile (`mobile/src/lib/bindings/mobile.ts`).
# Optionnelle, comme dans le core : seulement pour `cargo bindings` / `cargo bindings-check`.
ts-rs = { version = "12", optional = true }

[features]
ts = ["dep:ts-rs", "minestrator-core/ts"]
