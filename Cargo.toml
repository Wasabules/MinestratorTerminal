# Workspace racine : sépare la logique métier (minestrator-core) de ses frontends.
# Frontends : desktop/src-tauri (app desktop) et mobile/src-tauri (app Android/iOS, à venir).
# À venir aussi : daemon Linux, CLI/TUI — tous dépendront du même `minestrator-core`.
[workspace]
resolver = "2"
members = [
    "desktop/src-tauri",
    "mobile/src-tauri",
    "crates/minestrator-core",
    "crates/minestrator-mcp",
    "crates/minestrator-daemon",
]

[workspace.package]
version = "0.7.1"
edition = "2021"
authors = ["Geoffrey Lecoq"]
license = "GPL-3.0-or-later"

# Les symboles de débogage de la lib Rust pesaient 253 Mio à eux seuls dans l'APK Android debug
# (503 Mio au total), au point de faire échouer l'installation par `adb`. Les retirer ramène
# l'APK à quelques dizaines de Mio et rend les allers-retours de développement tenables.
# Contrepartie assumée : les backtraces Rust en debug perdent leurs noms de fonctions.
[profile.dev]
strip = "debuginfo"
